[package]
name = "cpp_rust_transpiler"
version = "0.1.0"
edition = "2021"
authors = ["Transpiler Team"]
description = "A bidirectional C++ ↔ Rust source-to-source transpiler"
license = "MIT OR Apache-2.0"

[[bin]]
name = "transpiler"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
tree-sitter = "0.24"
tree-sitter-cpp = "0.23"
# syn = { version = "2", features = ["full", "visit"] }
# clang = { version = "2", features = ["clang_15_0"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
